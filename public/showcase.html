<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İSG SaaS - Sayfa Yapısı & Layout Karşılaştırma Masası</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 4px; }
    .layout-btn.active {
      box-shadow: 0 0 0 2px #f97316, 0 10px 15px -3px rgba(249, 115, 22, 0.2);
      border-color: #f97316 !important;
      background-color: #1e293b !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-orange-500 selection:text-white">

  <!-- TOP BAR: DÜZEN SEÇİCİ -->
  <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-6 py-4 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
      
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-orange-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-orange-600/30">
          🏗️
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-tight flex items-center gap-2">
            İSG SaaS Mimari & Ekran Düzeni (Layout) Masası
          </h1>
          <p class="text-xs text-slate-400">Renk teması değil; gerçek sayfa düzeni, iş akışı ve ekran ergonomisi</p>
        </div>
      </div>

      <!-- Layout Selector Buttons -->
      <div class="flex flex-wrap items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
        <button onclick="setLayout('workbench')" id="btn-workbench" class="layout-btn active px-3.5 py-2 rounded-lg text-xs font-semibold transition-all border border-transparent text-white flex items-center gap-2">
          <span>📐</span> 1. Saha Masası (3 Sütunlu Canlı Masa)
        </button>

        <button onclick="setLayout('kanban')" id="btn-kanban" class="layout-btn px-3.5 py-2 rounded-lg text-xs font-semibold transition-all border border-transparent text-slate-400 hover:text-white flex items-center gap-2">
          <span>📋</span> 2. DÖF & Şantiye Kokpiti (Kanban)
        </button>

        <button onclick="setLayout('station')" id="btn-station" class="layout-btn px-3.5 py-2 rounded-lg text-xs font-semibold transition-all border border-transparent text-slate-400 hover:text-white flex items-center gap-2">
          <span>📱</span> 3. Tablet Saha İstasyonu (Büyük Kartlar)
        </button>

        <div class="h-4 w-px bg-slate-800 mx-1"></div>

        <button onclick="setLayout('landing')" id="btn-landing" class="layout-btn px-3.5 py-2 rounded-lg text-xs font-semibold transition-all border border-transparent text-slate-400 hover:text-white flex items-center gap-2">
          <span>🌐</span> Sade Kurumsal Landing Page
        </button>
      </div>

    </div>
  </header>

  <!-- MİMARİ AÇIKLAMA BİLGİ KUTUSU -->
  <section class="max-w-7xl mx-auto px-6 pt-5">
    <div id="layout-description" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-xs transition-all">
      <!-- Dinamik açıklama -->
    </div>
  </section>

  <!-- CANLI EKRAN ÖNİZLEMESİ -->
  <main class="max-w-7xl mx-auto px-6 py-5">
    <div id="screen-container" class="rounded-2xl border border-slate-800 bg-white text-slate-900 shadow-2xl overflow-hidden min-h-[680px]">
      <!-- Layout içeriği buraya yüklenecek -->
    </div>
  </main>

  <script>
    let currentLayout = 'workbench';

    const LAYOUT_INFOS = {
      workbench: {
        title: "1. Düzen: 'Saha Masası' (3-Sütunlu Senkronize Tezgah)",
        why: "Sayfa Değiştirmeyi Sıfırlayan Mimari:",
        detail: "Sol tarafta şantiyeler, ortada yüklenen fotoğraflar ve AI risk analiz kartları, sağ tarafta ise anlık oluşan resmi A4 kağıdı. Kullanıcı menülerde kaybolmaz; ortada bir bulguyu düzenlediği anda sağdaki resmi evrakta anında güncellendiğini görür. 'Raporu oluşturup indirmeden önce nasıl göründüğünü' tek ekranda kontrol eder.",
        badge: "En Hızlı Raporlama UX"
      },
      kanban: {
        title: "2. Düzen: 'DÖF & Şantiye Kokpiti' (İş Takip & Taşeron Yönetimi)",
        why: "Rapor Yazmanın Ötesine Geçen Mimari:",
        detail: "Bir İSG uzmanının asıl derdi sadece PDF basmak değil, kusurların şantiyede düzeltilip düzeltilmediğidir. Bu düzende üstte gerçek İSG metrikleri (Kritik Açık Riskler, Süresi Dolan DÖF'ler), ortada ise Trello/Jira tarzı 3 kolonlu takip panosu bulunur: 'Açık Tehlikeler', 'Taşeron Düzeltti / Onay Bekliyor', 'Kapatılanlar'.",
        badge: "Kurumsal OSGB & Müteahhit Standardı"
      },
      station: {
        title: "3. Düzen: 'Tablet Saha İstasyonu' (Mobil Öncelikli Büyük Butonlar)",
        why: "Sahada Tozda ve Eldivenle Kullanım Ergonomisi:",
        detail: "Karmaşık tablolar ve küçük linkler yerine ekranda 4 dev odaklı buton yer alır: [Yeni Saha Denetimi Başlat], [Son Tutanaklar & PDF], [Açık Uygunsuzluklar], [Şantiye ve Taşeron Rehberi]. Sahada ayakta yürürken tek parmakla doğrudan amaca ulaşılır.",
        badge: "Şantiye Tableti Ergonomisi"
      },
      landing: {
        title: "Sade & Kurumsal B2B Landing Page (Gereksiz Oyuncaksız)",
        why: "Doğrudan Değer Önerisi & Kurumsal Güven:",
        detail: "Karmaşık interaktif oyuncaklar yerine doğrudan ürünün ekran görüntüsü, çözdüğü dert (Word çilesi vs 90 saniye), 6331 mevzuat uyumluluğu, çift logolu resmi A4 örneği ve şeffaf fiyatlandırma. Gelen ziyaretçi 5 saniyede ne satın alacağını anlar.",
        badge: "Yüksek Dönüşümlü B2B Vitrin"
      }
    };

    function updateDescription() {
      const info = LAYOUT_INFOS[currentLayout];
      document.getElementById('layout-description').innerHTML = `
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="font-bold text-white text-sm">${info.title}</span>
              <span class="px-2 py-0.5 rounded-full bg-orange-500/10 text-orange-400 border border-orange-500/20 text-[10px] font-bold">${info.badge}</span>
            </div>
            <p class="text-slate-300 leading-relaxed text-xs">
              <strong class="text-orange-400">${info.why}</strong> ${info.detail}
            </p>
          </div>
        </div>
      `;
    }

    function setLayout(l) {
      currentLayout = l;
      document.querySelectorAll('.layout-btn').forEach(btn => {
        btn.classList.remove('active', 'text-white');
        btn.classList.add('text-slate-400');
      });

      const activeBtn = document.getElementById(`btn-${l}`);
      activeBtn.classList.add('active', 'text-white');
      activeBtn.classList.remove('text-slate-400');

      updateDescription();
      renderLayout();
    }

    function renderLayout() {
      const container = document.getElementById('screen-container');
      if (currentLayout === 'workbench') {
        container.innerHTML = getWorkbenchHTML();
      } else if (currentLayout === 'kanban') {
        container.innerHTML = getKanbanHTML();
      } else if (currentLayout === 'station') {
        container.innerHTML = getStationHTML();
      } else if (currentLayout === 'landing') {
        container.innerHTML = getLandingHTML();
      }
    }

    // ==========================================
    // 1. DÜZEN: 3 SÜTUNLU CANLI SAHA MASASI
    // ==========================================

                    <span class="text-[11px] text-slate-500 block mt-0.5">Altyapı & Kazı</span>

                      <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 text-[10px]">Arşivlendi</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Alt Kullanıcı Bilgisi -->
              <div class="pt-3 border-t border-slate-800 flex items-center gap-2.5">
                <div class="h-8 w-8 rounded-full bg-orange-600/20 text-orange-400 font-bold flex items-center justify-center text-xs">EG</div>
                <div>
                  <p class="text-xs font-bold text-white">Emin Gerim</p>
                  <p class="text-[10px] text-slate-400">A Sınıfı İSG Uzmanı</p>
                </div>
              </div>
            </div>

            <!-- SÜTUN 2: Saha Fotoğrafları & AI Tespitleri (%45 Genişlik) -->
            <div class="col-span-5 border-r border-slate-800 bg-slate-900 p-4 overflow-y-auto max-h-[660px]">
              
              <!-- Üst Eylem Alanı: Fotoğraf Yükle -->
              <div class="border-2 border-dashed border-slate-700 hover:border-orange-500/60 rounded-xl p-4 text-center bg-slate-950/40 cursor-pointer transition-all mb-4">
                <div class="flex items-center justify-center gap-2 text-xs font-bold text-orange-400">
                  <span class="text-base">📸</span> Fotoğraf Çekin veya Buraya Bırakın
                </div>
                <p class="text-[11px] text-slate-400 mt-1">Yapay zeka şantiye ihlalini, 6331 kanun maddesini ve DÖF önerisini 5 saniyede çıkarır.</p>
              </div>

              <div class="flex items-center justify-between mb-3">

                <span class="text-[11px] text-orange-400 cursor-pointer hover:underline">+ Manuel Madde Ekle</span>
              </div>

              <!-- BULGU 1 KARTI -->
              <div class="p-3.5 rounded-xl border border-red-500/30 bg-slate-950/80 mb-3 space-y-2.5 shadow-sm">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="h-5 w-5 rounded-md bg-red-500/20 text-red-400 font-bold text-[11px] flex items-center justify-center">1</span>

                <div class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-[10px] text-slate-300 flex items-center gap-2">

              <div class="p-3.5 rounded-xl border border-red-500/30 bg-slate-950/80 space-y-2.5 shadow-sm">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="h-5 w-5 rounded-md bg-red-500/20 text-red-400 font-bold text-[11px] flex items-center justify-center">2</span>
                    <h4 class="font-bold text-white text-xs">Elektrik Ana Dağıtım Panosu Açık</h4>
                  </div>
                  <span class="px-2 py-0.5 rounded bg-red-500/20 text-red-400 font-bold text-[10px] border border-red-500/30">🔴 YÜKSEK RİSK</span>
                </div>

                <div class="flex gap-3">
                  <div class="h-16 w-16 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xl shrink-0 text-slate-500">
                    ⚡
                  </div>
                  <div class="text-[11px] text-slate-300 leading-relaxed">
                    Şantiye elektrik panosunun dış kapağı açık, sigortalar ve kablo bağlantıları doğrudan fiziksel temasa müsait.

                <div class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-[10px] text-slate-300 flex items-center gap-2">
                  <span class="font-bold text-orange-400">Mevzuat:</span>
                  <span>Elektrik İç Tesisleri Yön. Madde 25 & Yapı İSG Ek-4</span>
                </div>

                    <div><span class="text-slate-500">Rapor No:</span> <strong>RAP-2026-052</strong></div>
                  </div>

    // ==========================================
    // 2. DÜZEN: DÖF & ŞANTİYE KOKPİTİ (KANBAN)
    // ==========================================
    function getKanbanHTML() {
      return `
        <div class="bg-slate-900 text-slate-100 min-h-[700px] flex font-sans">
          
          <!-- Sol Sidebar Menü -->

            <div>
              <div class="flex items-center gap-2 mb-6">
                <div class="h-7 w-7 rounded-lg bg-orange-600 text-white flex items-center justify-center font-bold text-xs">⛑️</div>
                <span class="font-extrabold text-white text-sm">İSG Kokpit</span>
              </div>

              <nav class="space-y-1 text-xs">
                <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-lg bg-orange-600 text-white font-bold">
                  <span>📋</span> DÖF & Aksiyon Panosu
